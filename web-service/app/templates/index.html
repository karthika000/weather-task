<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherTask</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>WeatherTask</h1>
            <p class="subtitle">Plan your tasks with current weather information.</p>
        </header>

        <section class="panel">
            <h2>Add Task</h2>
            <form id="task-form">
                <label for="title">Task title</label>
                <input id="title" name="title" type="text" required>

                <label for="city">City</label>
                <input id="city" name="city" type="text" required>

                <label for="due_date">Due date</label>
                <input id="due_date" name="due_date" type="date">

                <button type="submit">Add Task</button>
            </form>
            <p id="message" class="message"></p>
        </section>

        <section>
            <h2>My Tasks</h2>
            <div id="task-list"><p class="empty">Loading tasks…</p></div>
        </section>
    </main>

    <script>
        // The browser only talks to the Web Service (/api/...).
        // It never calls the Task Service, the Weather Service or Open-Meteo directly.
        const form = document.getElementById("task-form");
        const taskList = document.getElementById("task-list");
        const message = document.getElementById("message");

        // Weather per city, fetched once per page visit (a browser refresh fetches it again).
        // This avoids re-requesting the weather every time a task is added or updated.
        const weatherByCity = {};

        // Create an element. textContent is used so user input is never parsed as HTML.
        function el(tag, className, text) {
            const element = document.createElement(tag);
            if (className) element.className = className;
            if (text !== undefined) element.textContent = text;
            return element;
        }

        function showMessage(text, isError = false) {
            message.textContent = text;
            message.className = isError ? "message error" : "message";
        }

        // Turn FastAPI error details (a string or a list of validation errors) into text.
        function formatDetail(detail) {
            if (Array.isArray(detail)) {
                return detail.map(d => `${d.loc[d.loc.length - 1]}: ${d.msg}`).join("; ");
            }
            return detail || "Unknown error";
        }

        async function api(method, path, body) {
            const options = { method };
            if (body !== undefined) {
                options.headers = { "Content-Type": "application/json" };
                options.body = JSON.stringify(body);
            }
            const response = await fetch(path, options);
            if (!response.ok) {
                let detail = `HTTP ${response.status}`;
                try { detail = formatDetail((await response.json()).detail); } catch {}
                throw new Error(detail);
            }
            return response.status === 204 ? null : response.json();
        }

        async function loadTasks() {
            let tasks;
            try {
                tasks = await api("GET", "/api/tasks");
            } catch (err) {
                taskList.replaceChildren(el("p", "error", `Could not load tasks: ${err.message}`));
                return;
            }
            if (tasks.length === 0) {
                taskList.replaceChildren(el("p", "empty", "No tasks yet."));
                return;
            }
            taskList.replaceChildren(...tasks.map(renderTask));
        }

        function renderTask(task) {
            const card = el("article", task.completed ? "task completed" : "task");

            const header = el("div", "task-header");
            header.append(
                el("h3", null, task.title),
                el("span", task.completed ? "badge done" : "badge", task.completed ? "Completed" : "Open")
            );

            const details = el("p", "details", task.city + (task.due_date ? ` · Due ${task.due_date}` : ""));
            const weather = el("p", "weather", "Loading weather…");

            const actions = el("div", "actions");
            const toggle = el("button", null, task.completed ? "Undo" : "Complete");
            toggle.onclick = () => runAction(() =>
                api("PATCH", `/api/tasks/${task.id}`, { completed: !task.completed }));
            const remove = el("button", "danger", "Delete");
            remove.onclick = () => runAction(() => api("DELETE", `/api/tasks/${task.id}`));
            actions.append(toggle, remove);

            card.append(header, details, weather, actions);

            // Weather is loaded separately, so a weather failure never hides the task.
            const key = task.city.toLowerCase();
            weatherByCity[key] ??= api("GET", `/api/weather/${encodeURIComponent(task.city)}`);
            weatherByCity[key]
                .then(w => {
                    const place = [w.city, w.region, w.country].filter(Boolean).join(", ");
                    weather.textContent =
                        `${w.temperature} °C · Wind ${w.wind_speed} km/h · Weather code ${w.weather_code} (${place})`;
                })
                .catch(() => {
                    weather.textContent = "Weather unavailable";
                    weather.classList.add("unavailable");
                });

            return card;
        }

        async function runAction(action) {
            try {
                await action();
                showMessage("");
            } catch (err) {
                showMessage(err.message, true);
            }
            await loadTasks();
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const task = {
                title: form.elements["title"].value,
                city: form.elements["city"].value,
                due_date: form.elements["due_date"].value || null,
            };
            try {
                await api("POST", "/api/tasks", task);
                form.reset();
                showMessage("Task added.");
                await loadTasks();
            } catch (err) {
                showMessage(`Could not add task: ${err.message}`, true);
            }
        });

        loadTasks();
    </script>
</body>
</html>
