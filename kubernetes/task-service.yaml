# Task Service: task CRUD REST API. The only component that accesses PostgreSQL.
# Stateless (all task data is in PostgreSQL), so it can be scaled with:
#   kubectl scale deployment task-service -n weather-task --replicas=3
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: weather-task
  labels:
    app: task-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      containers:
        - name: task-service
          image: karthika212/weather-task-task:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            # Connection string comes from the Secret (host: postgres-service).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: weathertask-db-secret
                  key: DATABASE_URL
          # The image runs as "appuser" (uid 1000). A numeric uid is required
          # so Kubernetes can verify runAsNonRoot for a named image user.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
# Internal-only Service. Reachable in the cluster as http://task-service:8001
apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: weather-task
spec:
  type: ClusterIP
  selector:
    app: task-service
  ports:
    - port: 8001
      targetPort: 8001
