# Database configuration for the WeatherTask demo.
#
# These are deliberately NON-PRODUCTION demo credentials for a university
# assignment. They are committed here only so the application can be deployed
# with a single `kubectl apply`.
#
# A production deployment should NOT commit credentials to source control.
# It should use an external secrets manager (e.g. HashiCorp Vault, AWS Secrets
# Manager, Azure Key Vault) or another secure mechanism such as Sealed Secrets
# or the External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: weathertask-db-secret
  namespace: weather-task
type: Opaque
stringData:
  # Used by the PostgreSQL container to initialise the database.
  POSTGRES_DB: weathertask
  POSTGRES_USER: weathertask
  POSTGRES_PASSWORD: devpassword
  # Used by the Task Service. "postgres-service" is the Kubernetes Service DNS name.
  DATABASE_URL: postgresql+psycopg://weathertask:devpassword@postgres-service:5432/weathertask
